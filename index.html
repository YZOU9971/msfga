
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Excel 双网格磁吸贴</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root {
  --chip-w:90px;
  --chip-h:54px;
  --gap:6px;
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:16px;
  background:#f4f6fb;
  color:#222;
  font-family:-apple-system,"Microsoft YaHei",sans-serif;
}
h1 { font-size:20px;margin:0 0 16px; }
h2 { font-size:15px;margin:0 0 10px; }
h3 { font-size:14px;margin:0 0 10px; }
.upload {
  display:block;
  background:white;
  border:2px dashed #999;
  border-radius:10px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  margin-bottom:12px;
}
.upload input { display:none; }
.upload strong { color:#3478c0; }
.toolbar {
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
select,button {
  padding:9px;
  border:1px solid #ccc;
  border-radius:7px;
  background:white;
  font-size:14px;
}
.status {
  font-size:13px;
  color:#555;
  margin-bottom:15px;
  line-height:1.6;
  white-space:pre-wrap;
}
.status.error { color:#c0392b; }
.surface {
  background:white;
  border:1px solid #ddd;
  border-radius:9px;
  padding:10px;
}

/* 上方扁平单元格池 */
.pool-section { margin-bottom:20px; }
.pool {
  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:var(--gap);
  min-height:68px;
  max-height:190px;
  overflow-y:auto;
}

/* 下方双网格横向并排 */
.grids-scroll {
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:8px;
}
.grids-row {
  display:flex;
  align-items:flex-start;
  gap:22px;
  width:max-content;
}
.grid-block { flex:none; }
.grid {
  display:grid;
  grid-template-columns:repeat(5,var(--chip-w));
  grid-template-rows:repeat(6,var(--chip-h));
  gap:var(--gap);
}
.slot {
  width:var(--chip-w);
  height:var(--chip-h);
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px dashed #ccc;
  border-radius:6px;
  color:#aaa;
  font-size:11px;
  overflow:hidden;
}
.slot.occupied {
  border:1px solid #4a90d9;
}

/* 所有磁吸贴尺寸完全一致 */
.chip {
  width:var(--chip-w);
  height:var(--chip-h);
  min-width:var(--chip-w);
  max-width:var(--chip-w);
  min-height:var(--chip-h);
  max-height:var(--chip-h);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px 5px;
  border:1px solid rgba(0,0,0,.15);
  border-radius:6px;
  background:#e8f0fe;
  color:#1a3a6e;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
  text-align:center;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  overflow:auto;
  scrollbar-width:none;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
.chip::-webkit-scrollbar { display:none; }
.chip.dragging { opacity:.3; }
.ghost {
  position:fixed;
  z-index:9999;
  pointer-events:none;
  opacity:.85;
  box-shadow:0 4px 15px #0003;
}
.hover {
  outline:2px solid #f59e0b;
  background-color:#fffbeb;
}
.hint {
  font-size:12px;
  color:#888;
  margin-top:8px;
}
details {
  margin-top:20px;
  background:white;
  padding:14px;
  border:1px solid #ddd;
  border-radius:8px;
}
summary { cursor:pointer; }
#preview {
  overflow:auto;
  max-height:400px;
  margin-top:12px;
}
table {
  border-collapse:collapse;
  font-size:12px;
}
td,th {
  border:1px solid #ccc;
  padding:6px 10px;
  white-space:pre-wrap;
}
th { background:#e0e7f5; }

@media(max-width:600px) {
  body { padding:12px; }
  h1 { font-size:18px; }
  .grids-row { gap:14px; }
  .pool { max-height:175px; }
  .surface { padding:8px; }
}
</style>
</head>
<body>

<h1>Excel 单元格 → 双 5×6 磁吸贴</h1>

<label class="upload">
  点击从「文件」中选择 Excel
  <p><strong>选择 .xlsx / .csv 文件</strong></p>
  <input id="file" type="file"
    accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv">
</label>

<div class="toolbar">
  <label>工作表：
    <select id="sheet" disabled></select>
  </label>
  <button id="reset">重置当前排列</button>
</div>

<div class="status" id="status">请选择 Excel 文件。</div>

<section class="pool-section">
  <h2>未放置单元格 <span id="poolCount"></span></h2>
  <div id="pool" class="surface pool"></div>
  <div class="hint">按住磁吸贴拖入下方网格，也可拖回这里。</div>
</section>

<section>
  <h2>目标网格（共 60 格）</h2>
  <div class="grids-scroll">
    <div class="grids-row">
      <div class="grid-block">
        <h3>网格一 · 5 × 6</h3>
        <div class="surface">
          <div id="grid1" class="grid"></div>
        </div>
      </div>
      <div class="grid-block">
        <h3>网格二 · 5 × 6</h3>
        <div class="surface">
          <div id="grid2" class="grid"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint">
    两个网格可相互交换。手机端可横向滚动查看。
  </div>
</section>

<details>
  <summary>查看原始表格</summary>
  <div id="preview"></div>
</details>

<script>
"use strict";

const $=id=>document.getElementById(id);
const pool=$("pool");

let zip=null;
let styles=null;
let sheetPaths={};
let sharedStrings=[];
let csvRows=null;
let poolData=[];
let gridData=Array(60).fill(null);
let currentSheet="";
let pointer=null;

// 初始化两个网格
for(let i=0;i<60;i++){
  const slot=document.createElement("div");
  slot.className="slot";
  slot.dataset.index=i;
  slot.textContent="空";
  $(i<30?"grid1":"grid2").append(slot);
}

const child=(el,name)=>el
  ?Array.from(el.children).find(x=>x.localName===name)
  :null;

const children=(el,name)=>el
  ?Array.from(el.children).filter(x=>x.localName===name)
  :[];

function parseXML(text){
  const doc=new DOMParser().parseFromString(
    text,"application/xml"
  );
  if(doc.getElementsByTagName("parsererror").length)
    throw Error("XML 解析失败");
  return doc;
}

function normalizePath(path){
  const parts=[];
  for(const p of path.replace(/^\/+/,"").split("/")){
    if(p==="..")parts.pop();
    else if(p&&p!==".")parts.push(p);
  }
  return parts.join("/");
}

function resolvePath(base,target){
  return normalizePath(
    target.startsWith("/")?target:base+"/"+target
  );
}

// Excel 标准索引颜色
const indexedColors=[
"000000","FFFFFF","FF0000","00FF00","0000FF","FFFF00",
"FF00FF","00FFFF","000000","FFFFFF","FF0000","00FF00",
"0000FF","FFFF00","FF00FF","00FFFF","800000","008000",
"000080","808000","800080","008080","C0C0C0","808080",
"9999FF","993366","FFFFCC","CCFFFF","660066","FF8080",
"0066CC","CCCCFF","000080","FF00FF","FFFF00","00FFFF",
"800080","800000","008080","0000FF","00CCFF","CCFFFF",
"CCFFCC","FFFF99","99CCFF","FF99CC","CC99FF","FFCC99",
"3366FF","33CCCC","99CC00","FFCC00","FF9900","FF6600",
"666699","969696","003366","339966","003300","333300",
"993300","993366","333399","333333"
];

function toHex(value){
  if(!value||!/^[0-9a-f]{6}([0-9a-f]{2})?$/i.test(value))
    return null;
  return "#"+value.slice(-6);
}

function applyTint(color,tint){
  if(!color||!tint)return color;
  const t=Number(tint);
  if(!Number.isFinite(t))return color;

  const rgb=parseInt(color.slice(1),16);
  const result=[];

  for(let shift=16;shift>=0;shift-=8){
    const v=(rgb>>shift)&255;
    const adjusted=t<0?v*(1+t):v*(1-t)+255*t;
    result.push(
      Math.max(0,Math.min(255,Math.round(adjusted)))
        .toString(16).padStart(2,"0")
    );
  }
  return "#"+result.join("");
}

function colorOf(node){
  if(!node)return null;
  let color=null;

  if(node.hasAttribute("rgb"))
    color=toHex(node.getAttribute("rgb"));
  else if(node.hasAttribute("indexed"))
    color=toHex(indexedColors[
      Number(node.getAttribute("indexed"))
    ]);
  else if(node.hasAttribute("theme"))
    color=styles?.theme[
      Number(node.getAttribute("theme"))
    ]||null;

  return applyTint(color,node.getAttribute("tint"));
}

async function readStyles(){
  const entry=zip.file("xl/styles.xml");
  if(!entry)return {
    fonts:[],fills:[],xfs:[],theme:[]
  };

  const root=parseXML(
    await entry.async("string")
  ).documentElement;

  const theme=[];
  const themeFile=zip.file("xl/theme/theme1.xml");

  if(themeFile){
    const doc=parseXML(await themeFile.async("string"));
    const scheme=Array.from(
      doc.getElementsByTagName("*")
    ).find(x=>x.localName==="clrScheme");

    const names=[
      "lt1","dk1","lt2","dk2",
      "accent1","accent2","accent3","accent4",
      "accent5","accent6","hlink","folHlink"
    ];

    if(scheme){
      names.forEach((name,index)=>{
        const el=child(scheme,name);
        const c=el?.firstElementChild;
        theme[index]=toHex(
          c?.getAttribute("lastClr")||
          c?.getAttribute("val")||""
        );
      });
    }
  }

  return {
    theme,
    fonts:children(child(root,"fonts"),"font"),
    fills:children(child(root,"fills"),"fill"),
    xfs:children(child(root,"cellXfs"),"xf")
  };
}

function styleFor(index){
  const xf=styles?.xfs[Number(index)||0];
  if(!xf)return {};

  const font=styles.fonts[
    Number(xf.getAttribute("fontId"))||0
  ];
  const fill=styles.fills[
    Number(xf.getAttribute("fillId"))||0
  ];

  const color=colorOf(child(font,"color"));
  const pattern=child(fill,"patternFill");

  const bg=pattern?.getAttribute("patternType")==="solid"
    ?colorOf(child(pattern,"fgColor"))
    :null;

  return {color,bg};
}

async function readWorkbook(){
  const workbookFile=zip.file("xl/workbook.xml");
  const relFile=zip.file("xl/_rels/workbook.xml.rels");

  if(!workbookFile||!relFile)
    throw Error("缺少工作簿文件");

  const book=parseXML(
    await workbookFile.async("string")
  );
  const rel=parseXML(
    await relFile.async("string")
  );

  const relationships={};

  for(const r of Array.from(
    rel.getElementsByTagName("*")
  ).filter(x=>x.localName==="Relationship")){
    relationships[r.getAttribute("Id")]=
      r.getAttribute("Target");
  }

  const result={};

  for(const s of Array.from(
    book.getElementsByTagName("*")
  ).filter(x=>x.localName==="sheet")){
    const id=s.getAttribute("r:id")||
      s.getAttributeNS(
        "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
        "id"
      );

    const target=relationships[id];
    if(target)
      result[s.getAttribute("name")]=
        resolvePath("xl",target);
  }

  return result;
}

async function readSharedStrings(){
  const entry=zip.file("xl/sharedStrings.xml");
  if(!entry)return [];

  const root=parseXML(
    await entry.async("string")
  ).documentElement;

  return children(root,"si").map(si=>
    Array.from(si.getElementsByTagName("*"))
      .filter(x=>x.localName==="t")
      .map(x=>x.textContent).join("")
  );
}

function columnIndex(address){
  const m=/^[A-Z]+/i.exec(address);
  if(!m)return -1;

  let n=0;
  for(const ch of m[0].toUpperCase())
    n=n*26+ch.charCodeAt(0)-64;

  return n-1;
}

function parseCSV(text){
  const rows=[];
  let row=[],value="",quoted=false;

  for(let i=0;i<text.length;i++){
    const ch=text[i];

    if(ch==='"'){
      if(quoted&&text[i+1]==='"'){
        value+='"';
        i++;
      }else quoted=!quoted;
    }else if(ch===","&&!quoted){
      row.push(value);
      value="";
    }else if((ch==="\n"||ch==="\r")&&!quoted){
      if(ch==="\r"&&text[i+1]==="\n")i++;
      row.push(value);
      rows.push(row);
      row=[];
      value="";
    }else value+=ch;
  }

  row.push(value);
  if(row.some(v=>v!==""))rows.push(row);
  return rows;
}

async function loadSheet(name){
  currentSheet=name;
  let data=[];

  if(csvRows){
    data=csvRows.map((row,r)=>
      row.map((value,c)=>({
        addr:`R${r+1}C${c+1}`,
        value:String(value),
        style:{}
      }))
    );
  }else{
    const path=sheetPaths[name];
    const entry=path&&zip.file(path);

    if(!entry)
      throw Error("找不到工作表："+path);

    const root=parseXML(
      await entry.async("string")
    );

    const rows=Array.from(
      root.getElementsByTagName("*")
    ).filter(x=>x.localName==="row");

    for(const row of rows){
      const out=[];

      for(const c of children(row,"c")){
        const addr=c.getAttribute("r")||"";
        const ci=columnIndex(addr);
        if(ci<0)continue;

        const type=c.getAttribute("t");
        const v=child(c,"v")?.textContent||"";
        let value=v;

        if(type==="s"){
          value=sharedStrings[Number(v)]||"";
        }else if(type==="inlineStr"){
          const is=child(c,"is");
          value=is
            ?Array.from(is.getElementsByTagName("*"))
              .filter(x=>x.localName==="t")
              .map(x=>x.textContent).join("")
            :"";
        }else if(type==="b"){
          value=v==="1"?"TRUE":"FALSE";
        }

        value=String(value).replace(/\r\n?/g,"\n");

        out[ci]={
          addr,
          value,
          style:styleFor(c.getAttribute("s"))
        };
      }
      data.push(out);
    }
  }

  const items=[],preview=[];
  let fontCount=0,fillCount=0;

  data.forEach((row,r)=>{
    const values=[];

    row.forEach((obj,c)=>{
      values[c]=obj?.value||"";

      if(r===0||!obj||!obj.value.trim())return;

      if(obj.style.color)fontCount++;
      if(obj.style.bg)fillCount++;

      items.push({
        id:name+"!"+obj.addr,
        text:obj.value,
        style:obj.style
      });
    });

    preview.push(values);
  });

  poolData=items;
  gridData=Array(60).fill(null);

  render();
  renderPreview(preview);

  $("status").classList.remove("error");
  $("status").textContent=
    `工作表：${name}｜有效单元格：${items.length}｜字体颜色：${fontCount}｜填充颜色：${fillCount}`;
}

function createChip(item,where,index){
  const el=document.createElement("div");
  el.className="chip";
  el.textContent=item.text;
  el.dataset.where=where;
  el.dataset.index=index;
  el.title=item.id+" · "+item.text;

  const s=item.style||{};
  if(s.color)el.style.color=s.color;
  if(s.bg)el.style.backgroundColor=s.bg;

  return el;
}

function render(){
  pool.replaceChildren(
    ...poolData.map((item,i)=>
      createChip(item,"pool",i)
    )
  );

  const slots=document.querySelectorAll(
    "#grid1 .slot,#grid2 .slot"
  );

  slots.forEach((slot,i)=>{
    slot.className="slot";
    slot.replaceChildren();

    const item=gridData[i];

    if(item){
      slot.classList.add("occupied");
      slot.append(
        createChip(item,"grid",i)
      );
    }else{
      slot.textContent="空";
    }
  });

  $("poolCount").textContent=
    `(${poolData.length})`;
}

function renderPreview(rows){
  const table=document.createElement("table");

  rows.slice(0,500).forEach((row,i)=>{
    const tr=document.createElement("tr");

    row.forEach(value=>{
      const cell=document.createElement(
        i===0?"th":"td"
      );
      cell.textContent=value||"";
      tr.append(cell);
    });

    table.append(tr);
  });

  $("preview").replaceChildren(table);
}

// 统一移动与交换
function moveItem(from,to){
  if(!from||!to)return;

  if(from.where===to.where&&
     from.index===to.index)return;

  const item=from.where==="pool"
    ?poolData[from.index]
    :gridData[from.index];

  if(!item)return;

  if(to.where==="grid"){
    const displaced=gridData[to.index];

    if(from.where==="pool"){
      poolData.splice(from.index,1);
      if(displaced)
        poolData.push(displaced);
    }else{
      gridData[from.index]=displaced||null;
    }

    gridData[to.index]=item;

  }else if(to.where==="pool"&&
           from.where==="grid"){
    gridData[from.index]=null;
    poolData.push(item);
  }

  render();
}

// iOS 与桌面触屏拖放
function targetAt(x,y){
  const el=document.elementFromPoint(x,y);
  if(!el)return null;

  const slot=el.closest(".slot");

  if(slot)return {
    where:"grid",
    index:Number(slot.dataset.index),
    el:slot
  };

  if(el.closest("#pool"))
    return {
      where:"pool",
      index:-1,
      el:pool
    };

  return null;
}

function clearHover(){
  document.querySelectorAll(".hover")
    .forEach(el=>el.classList.remove("hover"));
}

document.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".chip");

  if(!el||!el.closest("#grid1,#grid2,#pool"))
    return;

  if(e.pointerType==="mouse"&&e.button!==0)
    return;

  e.preventDefault();

  pointer={
    id:e.pointerId,
    x:e.clientX,
    y:e.clientY,
    source:{
      where:el.dataset.where,
      index:Number(el.dataset.index)
    },
    el,
    ghost:null
  };

  try{
    el.setPointerCapture(e.pointerId);
  }catch(_){}
});

document.addEventListener("pointermove",e=>{
  if(!pointer||pointer.id!==e.pointerId)
    return;

  e.preventDefault();
  const p=pointer;

  if(!p.ghost&&
     Math.hypot(e.clientX-p.x,e.clientY-p.y)>6){

    p.ghost=p.el.cloneNode(true);
    p.ghost.classList.add("ghost");
    document.body.append(p.ghost);
    p.el.classList.add("dragging");
  }

  if(p.ghost){
    p.ghost.style.left=(e.clientX+12)+"px";
    p.ghost.style.top=(e.clientY+12)+"px";

    clearHover();

    const t=targetAt(e.clientX,e.clientY);
    if(t)t.el.classList.add("hover");
  }
},{passive:false});

function endPointer(e,commit){
  if(!pointer||pointer.id!==e.pointerId)
    return;

  const p=pointer;
  pointer=null;

  const target=commit&&p.ghost
    ?targetAt(e.clientX,e.clientY)
    :null;

  p.ghost?.remove();
  p.el.classList.remove("dragging");
  clearHover();

  if(target)moveItem(p.source,target);
}

document.addEventListener("pointerup",
  e=>endPointer(e,true)
);

document.addEventListener("pointercancel",
  e=>endPointer(e,false)
);

// Excel 文件读取
$("file").addEventListener("change",async e=>{
  const file=e.target.files?.[0];
  if(!file)return;

  const status=$("status");
  status.classList.remove("error");
  status.textContent="正在读取："+file.name;

  try{
    zip=null;
    styles=null;
    sheetPaths={};
    sharedStrings=[];
    csvRows=null;

    let names=[];

    if(/\.csv$/i.test(file.name)){
      let text=await file.text();

      if(text.charCodeAt(0)===0xFEFF)
        text=text.slice(1);

      csvRows=parseCSV(text);
      names=["CSV"];

    }else if(/\.xlsx$/i.test(file.name)){
      if(typeof JSZip==="undefined")
        throw Error("JSZip 未加载，请检查网络连接");

      zip=await JSZip.loadAsync(
        await file.arrayBuffer()
      );

      styles=await readStyles();
      sheetPaths=await readWorkbook();
      sharedStrings=await readSharedStrings();
      names=Object.keys(sheetPaths);

    }else{
      throw Error("仅支持 .xlsx 和 .csv");
    }

    if(!names.length)
      throw Error("没有找到工作表");

    const select=$("sheet");
    select.replaceChildren();

    names.forEach(name=>{
      const option=document.createElement("option");
      option.value=name;
      option.textContent=name;
      select.append(option);
    });

    select.disabled=false;
    select.value=names[0];

    await loadSheet(names[0]);

  }catch(err){
    status.classList.add("error");
    status.textContent="读取失败："+err.message;
    console.error(err);
  }finally{
    e.target.value="";
  }
});

$("sheet").addEventListener("change",async e=>{
  try{
    await loadSheet(e.target.value);
  }catch(err){
    $("status").classList.add("error");
    $("status").textContent=
      "工作表读取失败："+err.message;
  }
});

$("reset").addEventListener("click",()=>{
  if(currentSheet)loadSheet(currentSheet);
});
</script>
</body>
</html>
